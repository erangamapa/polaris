<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🫧 Bubble Girl · Gambling Casino</title>
  <link rel="preload" href="assets/girl.webp" as="image" type="image/webp">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      margin: 0;
      min-height: 100dvh;
      background: linear-gradient(145deg, #1a0a12 0%, #2d1522 100%);
      display: flex;
      justify-content: center;
      align-items: stretch;
      font-family: 'Segoe UI', 'Quicksand', system-ui, sans-serif;
      padding: 8px;
    }
    .game-wrapper {
      background: rgba(40, 18, 30, 0.95);
      backdrop-filter: blur(4px);
      border-radius: 28px;
      padding: 12px 12px 14px;
      box-shadow: 0 16px 36px rgba(0,0,0,0.8), 0 0 0 2px #ff6b9d inset, 0 0 24px rgba(255, 80, 140, 0.2);
      max-width: 700px;
      width: 100%;
      border: 1px solid rgba(255, 100, 150, 0.3);
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: calc(100dvh - 16px);
      overflow: hidden;
    }
    h1 {
      font-weight: 700;
      font-size: 1.35rem;
      letter-spacing: 1px;
      color: #ffb3d1;
      margin: 0;
      text-shadow: 0 0 16px rgba(255, 80, 160, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-shrink: 0;
    }
    h1 small {
      font-size: 0.65rem;
      background: linear-gradient(135deg, #ff6b9d, #c0396b);
      color: #fff0f5;
      padding: 2px 10px;
      border-radius: 40px;
      font-weight: 600;
      letter-spacing: 1px;
    }
    .canvas-container {
      background: rgba(20, 8, 15, 0.8);
      border-radius: 22px;
      padding: 0;
      margin: 0;
      box-shadow: 0 0 0 2px #ff6b9d, 0 8px 20px rgba(0,0,0,0.5);
      position: relative;
      overflow: hidden;
      width: 100%;
      aspect-ratio: 650 / 482;
      flex: 1 1 auto;
      min-height: 0;
      max-height: min(52dvh, 420px);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      max-width: none;
      background: #140a10;
      border-radius: 22px;
      cursor: pointer;
      touch-action: none;
      box-shadow: inset 0 0 40px rgba(255, 50, 100, 0.1);
    }
    .hud {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1.1fr 1fr;
      gap: 6px;
    }
    .stat-box {
      background: rgba(30, 12, 22, 0.9);
      border-radius: 12px;
      padding: 4px 6px;
      text-align: center;
      border: 1px solid rgba(255, 100, 150, 0.25);
    }
    .stat-label {
      color: #b38092;
      font-size: 0.55rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
    }
    .stat-value {
      color: #ffd4e2;
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.2;
    }
    .stat-value.multiplier { color: #ffd700; font-size: 1.15rem; }
    .stat-value.balance { color: #7dffb3; }
    .stat-value.bet { color: #ff9fbf; }
    .bet-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .bet-row input {
      flex: 1;
      min-width: 0;
      background: rgba(20, 8, 15, 0.9);
      border: 1.5px solid #ff6b9d;
      color: #ffd4e2;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 0.95rem;
      font-weight: 700;
      text-align: center;
      outline: none;
    }
    .chip-btn {
      flex: 0 0 auto;
      background: linear-gradient(135deg, #3d1a2e, #2a0f1e);
      border: 1.5px solid #ff6b9d;
      color: #ffd4e2;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 20px;
      cursor: pointer;
      min-width: 40px;
    }
    .chip-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .action-row {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 6px;
    }
    .ctrl-btn {
      background: linear-gradient(135deg, #3d1a2e, #2a0f1e);
      border: 1.5px solid #ff6b9d;
      color: #ffd4e2;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 9px 10px;
      border-radius: 22px;
      cursor: pointer;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .ctrl-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .ctrl-btn.primary {
      background: linear-gradient(135deg, #ff6b9d, #e0447a);
      border-color: #ff8ab3;
      color: white;
    }
    .status-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 1.2rem;
      padding: 0 2px;
    }
    .status-msg {
      color: #ffb3d1;
      font-weight: 600;
      font-size: 0.75rem;
      letter-spacing: 0.3px;
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .history-bar {
      display: flex;
      gap: 4px;
      align-items: center;
      flex-shrink: 0;
    }
    .history-bar .hist-label {
      color: #b38092;
      font-size: 0.55rem;
      letter-spacing: 1px;
    }
    .history-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.5rem;
      font-weight: 700;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .history-dot.win {
      background: rgba(0, 255, 100, 0.2);
      border-color: rgba(0, 255, 100, 0.4);
      color: #7dffb3;
    }
    .history-dot.bust {
      background: rgba(255, 0, 50, 0.2);
      border-color: rgba(255, 0, 50, 0.4);
      color: #ff6b6b;
    }
    @media (min-width: 560px) {
      body { padding: 16px; align-items: center; }
      .game-wrapper {
        padding: 18px 18px 20px;
        border-radius: 36px;
        gap: 10px;
        max-height: none;
      }
      h1 { font-size: 1.9rem; }
      h1 small { font-size: 0.85rem; padding: 3px 14px; }
      .canvas-container {
        max-height: none;
        border-radius: 28px;
      }
      canvas { border-radius: 28px; }
      .stat-value { font-size: 1.35rem; }
      .stat-value.multiplier { font-size: 1.5rem; }
      .ctrl-btn { font-size: 0.9rem; padding: 11px 14px; }
      .status-msg { font-size: 0.9rem; }
    }
  </style>
</head>
<body>
<div class="game-wrapper">
  <h1>
    🫧 Bubble Girl
    <small>CASINO</small>
  </h1>

  <div class="canvas-container">
    <canvas id="gameCanvas" width="650" height="482"></canvas>
  </div>

  <div class="hud">
    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-label">Balance</div>
        <div class="stat-value balance" id="balanceDisplay">1000</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Multiplier</div>
        <div class="stat-value multiplier" id="multiplierDisplay">1.00x</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Bet</div>
        <div class="stat-value bet" id="betDisplay">10</div>
      </div>
    </div>

    <div class="bet-row">
      <input type="number" id="betInput" value="10" min="1" step="1" aria-label="Bet amount">
      <button class="chip-btn" id="halfBetBtn" type="button">½</button>
      <button class="chip-btn" id="doubleBetBtn" type="button">2×</button>
    </div>

    <div class="action-row">
      <button class="ctrl-btn primary" id="cashOutBtn" type="button" disabled>💎 Cash Out</button>
      <button class="ctrl-btn" id="newRoundBtn" type="button">🔄 New Round</button>
    </div>

    <div class="status-line">
      <span class="status-msg" id="statusMessage">New Round, then hold to inflate</span>
      <div class="history-bar" id="historyBar">
        <span class="hist-label">H</span>
      </div>
    </div>
  </div>
</div>

<script>
  (function() {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const balanceDisplay = document.getElementById('balanceDisplay');
    const betDisplay = document.getElementById('betDisplay');
    const multiplierDisplay = document.getElementById('multiplierDisplay');
    const betInput = document.getElementById('betInput');
    const cashOutBtn = document.getElementById('cashOutBtn');
    const newRoundBtn = document.getElementById('newRoundBtn');
    const statusMessage = document.getElementById('statusMessage');
    const historyBar = document.getElementById('historyBar');
    const halfBetBtn = document.getElementById('halfBetBtn');
    const doubleBetBtn = document.getElementById('doubleBetBtn');

    // ----- GAME STATE -----
    let balance = 1000;
    let currentBet = 10;
    let multiplier = 1.00;
    let isHolding = false;
    let isRoundActive = false;
    let isBusted = false;
    let size = 0; // 0 to 1
    const GROWTH_RATE = 0.008;
    const BURST_THRESHOLD = 1.0;
    let history = []; // stores { result: 'win'|'bust', multiplier: number }
    let animationId = null;
    let winAmount = 0;

    // Character art + bubble anchor (mouth on 650×482 frame)
    const CW = 650;
    const CH = 482;
    const girlImg = new Image();
    girlImg.decoding = 'async';
    girlImg.src = 'assets/girl.webp';
    let imageReady = false;
    const BUBBLE_ANCHOR = { x: CW / 2, y: 220 };
    let popSound = null;

    function ensurePopSound() {
      if (popSound) return popSound;
      popSound = new Audio('assets/pop.mp3');
      popSound.preload = 'auto';
      popSound.volume = 0.85;
      return popSound;
    }

    function playPopSound() {
      try {
        const audio = ensurePopSound();
        audio.currentTime = 0;
        const play = audio.play();
        if (play && typeof play.catch === 'function') play.catch(() => {});
      } catch (_) {}
    }

    girlImg.onload = () => {
      imageReady = true;
      drawGame();
    };
    if (typeof girlImg.decode === 'function') {
      girlImg.decode().catch(() => {});
    }

    function drawCoverImage(img, w, h) {
      const iw = img.naturalWidth;
      const ih = img.naturalHeight;
      const scale = Math.max(w / iw, h / ih);
      const sw = w / scale;
      const sh = h / scale;
      const sx = (iw - sw) / 2;
      const sy = (ih - sh) / 2;
      ctx.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
    }

    function drawBubbleEffects(bubbleX, bubbleY, radius) {
      if (isBusted) {
        ctx.shadowBlur = 60;
        ctx.shadowColor = 'rgba(255, 0, 50, 0.6)';
        ctx.fillStyle = '#ff3366';
        for (let i = 0; i < 30; i++) {
          const angle = i * 1.2 + 0.5;
          const dist = 40 + Math.sin(i * 2.3) * 30 + size * 80;
          ctx.beginPath();
          ctx.arc(bubbleX + Math.cos(angle) * dist, bubbleY + Math.sin(angle) * dist,
                  8 + Math.sin(i) * 6, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.fillStyle = '#ff6699';
        for (let i = 0; i < 20; i++) {
          const angle = i * 1.8 + 0.2;
          const dist = 25 + Math.cos(i * 1.7) * 20 + size * 60;
          ctx.beginPath();
          ctx.arc(bubbleX + Math.cos(angle) * dist, bubbleY + Math.sin(angle) * dist,
                  5 + Math.cos(i) * 4, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.font = 'bold 60px sans-serif';
        ctx.fillStyle = '#ffdae7';
        ctx.shadowColor = '#ff0044';
        ctx.shadowBlur = 50;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('💥', bubbleX, bubbleY - 40);

        ctx.font = 'bold 28px sans-serif';
        ctx.fillStyle = '#ff6b6b';
        ctx.shadowBlur = 20;
        ctx.fillText('BUSTED!', CW / 2, CH - 28);
        return;
      }

      if (!isRoundActive && size === 0) return;

      const gradient = ctx.createRadialGradient(
        bubbleX - 20, bubbleY - 20, 10,
        bubbleX, bubbleY, radius + 10
      );
      const intensity = Math.min(1, size * 1.5);
      gradient.addColorStop(0, `rgba(255, 200, 230, ${0.6 + intensity * 0.4})`);
      gradient.addColorStop(0.4, `rgba(242, 123, 174, ${0.7 + intensity * 0.3})`);
      gradient.addColorStop(0.8, `rgba(220, 78, 130, ${0.8 + intensity * 0.2})`);
      gradient.addColorStop(1, 'rgba(166, 43, 90, 0.9)');

      ctx.shadowBlur = 40;
      ctx.shadowColor = `rgba(255, 60, 120, ${0.2 + size * 0.3})`;
      ctx.beginPath();
      ctx.arc(bubbleX, bubbleY, radius, 0, Math.PI * 2);
      ctx.fillStyle = gradient;
      ctx.fill();

      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.ellipse(bubbleX - 20, bubbleY - 25, 20, 14, -0.4, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.fill();

      if (size > 0.7) {
        ctx.shadowBlur = 10;
        ctx.strokeStyle = `rgba(255, 50, 50, ${(size - 0.7) * 3})`;
        ctx.lineWidth = 2.5;
        for (let i = 0; i < 6; i++) {
          const angle = i * 1.2 + 0.2;
          const xOff = Math.cos(angle) * radius * 0.7;
          const yOff = Math.sin(angle) * radius * 0.7;
          ctx.beginPath();
          ctx.moveTo(bubbleX + xOff - 8, bubbleY + yOff - 6);
          ctx.lineTo(bubbleX + xOff + 14, bubbleY + yOff + 8);
          ctx.stroke();
        }
      }

      if (size > 0.1) {
        ctx.shadowBlur = 20;
        ctx.shadowColor = 'rgba(0,0,0,0.5)';
        ctx.font = 'bold 28px sans-serif';
        ctx.fillStyle = 'white';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(`${multiplier.toFixed(2)}x`, bubbleX, bubbleY);
      }
    }

    function updateUI() {
      balanceDisplay.textContent = Math.floor(balance);
      betDisplay.textContent = currentBet;
      multiplierDisplay.textContent = multiplier.toFixed(2) + 'x';

      if (isBusted) {
        statusMessage.textContent = '💥 BUSTED — lost your bet';
        statusMessage.style.color = '#ff6b6b';
      } else if (isRoundActive && isHolding) {
        statusMessage.textContent = `🎈 Inflating… ${multiplier.toFixed(2)}x — release to pause`;
        statusMessage.style.color = '#ffd700';
      } else if (isRoundActive && !isHolding && size > 0) {
        statusMessage.textContent = `⏸ Paused at ${multiplier.toFixed(2)}x — hold again or Cash Out`;
        statusMessage.style.color = '#ffb3d1';
      } else if (isRoundActive) {
        statusMessage.textContent = '👆 Hold to inflate — Cash Out to bank';
        statusMessage.style.color = '#ffb3d1';
      } else {
        statusMessage.textContent = 'New Round, then hold to inflate';
        statusMessage.style.color = '#ffb3d1';
      }

      cashOutBtn.disabled = !isRoundActive || isBusted;
      newRoundBtn.disabled = isRoundActive && !isBusted;
      betInput.disabled = isRoundActive;
      halfBetBtn.disabled = isRoundActive;
      doubleBetBtn.disabled = isRoundActive;
    }

    function updateHistory() {
      historyBar.innerHTML = '<span class="hist-label">H</span>';
      history.slice(-8).forEach(item => {
        const dot = document.createElement('div');
        dot.className = `history-dot ${item.result}`;
        dot.textContent = item.result === 'win' ? '✓' : '✗';
        dot.title = `${item.result === 'win' ? 'Cashed out' : 'Busted'} at ${item.multiplier.toFixed(2)}x`;
        historyBar.appendChild(dot);
      });
    }

    // ----- GAME LOGIC -----
    function startRound() {
      const betValue = parseInt(betInput.value);
      if (isNaN(betValue) || betValue <= 0) {
        alert('Please enter a valid bet amount!');
        return;
      }
      if (betValue > balance) {
        alert('Insufficient balance!');
        return;
      }

      // Deduct bet
      balance -= betValue;
      currentBet = betValue;
      betInput.value = currentBet;

      isRoundActive = true;
      isBusted = false;
      isHolding = false;
      size = 0;
      multiplier = 1.00;
      winAmount = 0;
      ensurePopSound();

      updateUI();
      drawGame();
    }

    function cashOut() {
      if (!isRoundActive || isBusted) return;

      const won = Math.floor(currentBet * multiplier);
      balance += won;

      history.push({ result: 'win', multiplier: multiplier });
      updateHistory();

      isRoundActive = false;
      isHolding = false;
      isBusted = false;

      statusMessage.textContent = `🎉 Won ${won}! (${multiplier.toFixed(2)}x)`;
      statusMessage.style.color = '#7dffb3';

      updateUI();
      drawGame();
    }

    function bust() {
      if (isBusted || !isRoundActive) return;

      isBusted = true;
      isHolding = false;
      playPopSound();

      history.push({ result: 'bust', multiplier: multiplier });
      updateHistory();

      // Lose bet (already deducted)
      statusMessage.textContent = `💥 BUSTED at ${multiplier.toFixed(2)}x!`;
      statusMessage.style.color = '#ff6b6b';

      updateUI();
      drawGame();
    }

    function resetRound() {
      if (isRoundActive && !isBusted) {
        if (!confirm('Are you sure? You\'ll lose your current bet!')) return;
      }

      isRoundActive = false;
      isHolding = false;
      isBusted = false;
      size = 0;
      multiplier = 1.00;

      updateUI();
      drawGame();
    }

    // ----- CANVAS DRAWING -----
    function drawGame() {
      ctx.clearRect(0, 0, CW, CH);

      if (imageReady) {
        drawCoverImage(girlImg, CW, CH);
      } else {
        ctx.fillStyle = '#1a0a12';
        ctx.fillRect(0, 0, CW, CH);
        ctx.fillStyle = '#ffb3d1';
        ctx.font = '600 18px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('Loading…', CW / 2, CH / 2);
        return;
      }

      if (isBusted) {
        ctx.fillStyle = 'rgba(120, 20, 40, 0.25)';
        ctx.fillRect(0, 0, CW, CH);
      }

      const baseRadius = 12;
      const maxRadius = 115;
      const radius = baseRadius + size * (maxRadius - baseRadius);
      const bubbleX = BUBBLE_ANCHOR.x;
      const bubbleY = BUBBLE_ANCHOR.y + radius * 0.35;

      ctx.save();
      ctx.shadowBlur = 40;
      ctx.shadowColor = 'rgba(255, 60, 120, 0.3)';
      drawBubbleEffects(bubbleX, bubbleY, radius);
      ctx.restore();

      if (!isRoundActive && !isBusted && size === 0) {
        ctx.fillStyle = 'rgba(20, 8, 15, 0.35)';
        ctx.fillRect(0, 0, CW, CH);
        ctx.font = 'bold 22px sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
        ctx.shadowBlur = 12;
        ctx.fillText('💰 New Round to start · hold to inflate', CW / 2, 56);
      }
    }

    // ----- GAME LOOP -----
    function gameLoop() {
      animationId = null;
      if (isRoundActive && !isBusted && isHolding) {
        size = Math.min(BURST_THRESHOLD, size + GROWTH_RATE);
        multiplier = 1 + size * 3;

        if (size >= BURST_THRESHOLD) {
          bust();
        } else {
          updateUI();
          drawGame();
          animationId = requestAnimationFrame(gameLoop);
        }
      }
    }

    function startHoldLoop() {
      if (animationId) return;
      animationId = requestAnimationFrame(gameLoop);
    }

    // ----- EVENT HANDLERS -----
    function handlePointerDown(e) {
      e.preventDefault();
      if (!isRoundActive || isBusted) return;
      isHolding = true;
      updateUI();
      startHoldLoop();
    }

    function handlePointerUp(e) {
      e.preventDefault();
      // Release pauses inflation — keep size & multiplier
      isHolding = false;
      updateUI();
      drawGame();
    }

    function handlePointerLeave(e) {
      if (!isHolding) return;
      isHolding = false;
      updateUI();
      drawGame();
    }

    // ----- BET CONTROLS -----
    halfBetBtn.addEventListener('click', () => {
      if (isRoundActive) return;
      const val = Math.max(1, Math.floor(currentBet / 2));
      betInput.value = val;
      currentBet = val;
      updateUI();
    });

    doubleBetBtn.addEventListener('click', () => {
      if (isRoundActive) return;
      const val = Math.min(balance, currentBet * 2);
      betInput.value = Math.floor(val);
      currentBet = Math.floor(val);
      updateUI();
    });

    betInput.addEventListener('change', () => {
      if (isRoundActive) return;
      let val = parseInt(betInput.value);
      if (isNaN(val) || val < 1) val = 1;
      if (val > balance) val = balance;
      betInput.value = val;
      currentBet = val;
      updateUI();
    });

    // ----- BUTTON EVENTS -----
    newRoundBtn.addEventListener('click', startRound);
    cashOutBtn.addEventListener('click', cashOut);

    // ----- CANVAS EVENTS -----
    canvas.addEventListener('mousedown', handlePointerDown);
    window.addEventListener('mouseup', handlePointerUp);
    canvas.addEventListener('mouseleave', handlePointerLeave);

    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      handlePointerDown(e);
    }, { passive: false });

    canvas.addEventListener('touchend', (e) => {
      e.preventDefault();
      handlePointerUp(e);
    }, { passive: false });

    canvas.addEventListener('touchcancel', (e) => {
      e.preventDefault();
      handlePointerUp(e);
    }, { passive: false });

    // ----- INIT -----
    function init() {
      updateHistory();
      updateUI();
      drawGame();
    }

    init();

    window.addEventListener('beforeunload', () => {
      if (animationId) cancelAnimationFrame(animationId);
    });

  })();
</script>
</body>
</html>
