<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Raider 8-Frame Run</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-content: start center;
      gap: 20px; padding: 24px 16px 40px; background: #0a1210; color: #f4efe2;
      font-family: system-ui, sans-serif;
    }
    h1 { margin: 0; font-size: 1.25rem; }
    p { margin: 0; color: #8a9a90; font-size: 0.9rem; max-width: 36rem; }
    .panel {
      background: #12201c; border: 1px solid rgba(232, 199, 106, 0.35);
      border-radius: 12px; padding: 16px; display: grid; gap: 12px; justify-items: center;
    }
    canvas {
      image-rendering: pixelated;
      background:
        linear-gradient(45deg, #1a2a24 25%, transparent 25%),
        linear-gradient(-45deg, #1a2a24 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #1a2a24 75%),
        linear-gradient(-45deg, transparent 75%, #1a2a24 75%);
      background-size: 24px 24px;
      background-position: 0 0, 0 12px, 12px -12px, -12px 0;
      border-radius: 8px;
    }
    #preview { width: min(280px, 70vw); height: auto; }
    #sheet { width: min(920px, 96vw); height: auto; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .cell { text-align: center; font-size: 0.7rem; color: #8a9a90; }
    .cell canvas { width: 80px; height: auto; display: block; margin-bottom: 4px; }
    button {
      background: #e8c76a; color: #0a1210; border: 0; border-radius: 8px;
      padding: 8px 14px; font-weight: 700; cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>8-frame run cycle</h1>
  <p>Reference + generated frames · right stride → left stride → loop · size-unified · panic FPS</p>

  <div class="panel">
    <strong>Animation preview</strong>
    <canvas id="preview" width="320" height="480"></canvas>
    <label>
      FPS <span id="fpsLabel">12</span>
      <input id="fps" type="range" min="8" max="18" step="1" value="12" />
    </label>
  </div>

  <div class="panel">
    <strong>Individual frames</strong>
    <div class="row" id="frames"></div>
  </div>

  <div class="panel">
    <strong>Sprite sheet (1×8)</strong>
    <canvas id="sheet"></canvas>
    <button id="dl" type="button">Download sprite sheet PNG</button>
  </div>

  <script type="module">
    import { loadAssets, assets } from './src/assets.js';
    await loadAssets();
    const frames = assets.runFrames;
    const sheet = assets.runSheet;
    const fw = frames[0].width;
    const fh = frames[0].height;
    const labels = [
      '1 R plant', '2 R push', '3 pass', '4 L plant',
      '5 L push', '6 L cont', '7 recover', '8 bridge',
    ];

    const framesEl = document.getElementById('frames');
    frames.forEach((f, i) => {
      const cell = document.createElement('div');
      cell.className = 'cell';
      const c = document.createElement('canvas');
      c.width = f.width; c.height = f.height;
      c.getContext('2d').drawImage(f, 0, 0);
      cell.append(c, document.createTextNode(labels[i] || `F${i + 1}`));
      framesEl.append(cell);
    });

    const sheetCanvas = document.getElementById('sheet');
    sheetCanvas.width = sheet.width;
    sheetCanvas.height = sheet.height;
    sheetCanvas.getContext('2d').drawImage(sheet, 0, 0);
    document.getElementById('dl').onclick = () => {
      const a = document.createElement('a');
      a.href = sheet.toDataURL('image/png');
      a.download = 'raider-run-sheet.png';
      a.click();
    };

    const preview = document.getElementById('preview');
    const pctx = preview.getContext('2d');
    const fpsInput = document.getElementById('fps');
    const fpsLabel = document.getElementById('fpsLabel');
    let idx = 0, acc = 0, last = performance.now();
    function loop(ts) {
      const dt = ts - last; last = ts;
      const fps = Number(fpsInput.value);
      fpsLabel.textContent = String(fps);
      acc += dt;
      if (acc >= 1000 / fps) { acc -= 1000 / fps; idx = (idx + 1) % frames.length; }
      pctx.clearRect(0, 0, preview.width, preview.height);
      pctx.imageSmoothingEnabled = false;
      const scale = Math.min(preview.width / fw, preview.height / fh);
      const dw = fw * scale, dh = fh * scale;
      pctx.drawImage(frames[idx], (preview.width - dw) / 2, preview.height - dh - 8, dw, dh);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
