<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Raider Escape — Grapple Preview</title>
  <style>
    :root {
      --bg: #0a0c0e;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: radial-gradient(ellipse at 50% 70%, #1a2220 0%, var(--bg) 65%);
      color: #c8d0cc;
      font-family: system-ui, sans-serif;
      overflow: hidden;
    }
    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
    }
    .hint {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.85rem;
      opacity: 0.7;
      letter-spacing: 0.04em;
      pointer-events: none;
    }
    canvas {
      display: block;
      width: min(100vw, 960px);
      height: auto;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: transparent;
    }
  </style>
</head>
<body>
  <div class="stage">
    <canvas id="c" width="960" height="540" aria-label="Grapple escape preview"></canvas>
    <p class="hint">Space or click — replay</p>
  </div>
  <script type="module">
    /**
     * Standalone preview of the cash-out grapple escape.
     * Frames 1–4 planted; lift-off only on frame 5 (frame_008).
     */

    const FRAME_MS = 260;
    const GROUNDED_FRAMES = 4;
    const GROUNDED_MS = FRAME_MS * GROUNDED_FRAMES;
    const LIFT_MS = 900;
    const DURATION = GROUNDED_MS + LIFT_MS;
    const FRAME_COUNT = 5;
    const TARGET_H_RATIO = 0.48; // ~48% of canvas height

    const canvas = /** @type {HTMLCanvasElement} */ (document.getElementById('c'));
    const ctx = canvas.getContext('2d');

    /** @type {HTMLCanvasElement[]} */
    let frames = [];
    let animT = 0;
    let playing = false;
    let lastTs = 0;

    /** Key green / white / near-black studio bg */
    function keyOut(img) {
      const c = document.createElement('canvas');
      const w = img.naturalWidth;
      const h = img.naturalHeight;
      c.width = w;
      c.height = h;
      const g = c.getContext('2d', { willReadFrequently: true });
      if (!g) return c;
      g.drawImage(img, 0, 0);
      const data = g.getImageData(0, 0, w, h);
      const px = data.data;
      for (let i = 0; i < px.length; i += 4) {
        const r = px[i];
        const gr = px[i + 1];
        const b = px[i + 2];
        const green = gr > 150 && r < 110 && b < 110 && gr > r * 1.7;
        const white = r > 215 && gr > 215 && b > 215;
        const black = r < 10 && gr < 10 && b < 10;
        if (green || white || black) px[i + 3] = 0;
      }
      g.putImageData(data, 0, 0);
      return c;
    }

    function cropOpaque(src) {
      const g = src.getContext('2d', { willReadFrequently: true });
      if (!g) return src;
      const { data, width: w, height: h } = g.getImageData(0, 0, src.width, src.height);
      let minX = w, minY = h, maxX = 0, maxY = 0;
      let found = false;
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          if (data[(y * w + x) * 4 + 3] > 8) {
            found = true;
            if (x < minX) minX = x;
            if (y < minY) minY = y;
            if (x > maxX) maxX = x;
            if (y > maxY) maxY = y;
          }
        }
      }
      if (!found) return src;
      const out = document.createElement('canvas');
      out.width = maxX - minX + 1;
      out.height = maxY - minY + 1;
      out.getContext('2d')?.drawImage(src, minX, minY, out.width, out.height, 0, 0, out.width, out.height);
      return out;
    }

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
      });
    }

    async function preload() {
      const imgs = await Promise.all(
        Array.from({ length: FRAME_COUNT }, (_, i) => loadImage(`assets/escape-${i + 1}.png`)),
      );
      frames = imgs.map((img) => cropOpaque(keyOut(img)));
    }

    function restart() {
      animT = 0;
      playing = true;
    }

    function easeInCubic(u) {
      return u * u * u;
    }

    /**
     * @param {number} dt
     */
    function draw(dt) {
      if (!ctx || !frames.length) return;
      if (playing) animT = Math.min(DURATION, animT + dt);

      const W = canvas.width;
      const H = canvas.height;
      ctx.clearRect(0, 0, W, H);

      // Soft ground line for reference
      ctx.strokeStyle = 'rgba(255,255,255,0.08)';
      ctx.beginPath();
      ctx.moveTo(0, H * 0.78);
      ctx.lineTo(W, H * 0.78);
      ctx.stroke();

      let frameIdx;
      let e = 0;
      if (animT < GROUNDED_MS) {
        frameIdx = Math.min(GROUNDED_FRAMES - 1, Math.floor(animT / FRAME_MS));
      } else {
        frameIdx = FRAME_COUNT - 1;
        const u = Math.min(1, (animT - GROUNDED_MS) / LIFT_MS);
        e = easeInCubic(u);
      }

      const spr = frames[frameIdx];
      const targetH = H * TARGET_H_RATIO;
      const scale = targetH / spr.height;
      const dw = spr.width * scale;
      const dh = spr.height * scale;

      // Start centered; fly top-right only during last frame
      const startX = W * 0.5;
      const startY = H * 0.78;
      const x = startX + e * (W * 0.7);
      const y = startY - dh + 8 - e * (H * 1.05);
      const rot = e * (12 * Math.PI) / 180;

      const pivotX = x;
      const pivotY = y + dh * 0.45;
      const lifting = frameIdx === FRAME_COUNT - 1 && e > 0;

      if (lifting) {
        // Tip UV from lift sprite scan (same as game.js)
        // Approximate until scan runs — preview reimplements lightly:
        const tipLocalX = -dw / 2 + 0.78 * dw;
        const tipLocalY = -dh * 0.45 + 0.22 * dh;
        const cos = Math.cos(rot);
        const sin = Math.sin(rot);
        let tipX = pivotX + tipLocalX * cos - tipLocalY * sin;
        let tipY = pivotY + tipLocalX * sin + tipLocalY * cos;
        const anchorX = W - 3;
        const anchorY = 3;
        const dx = anchorX - tipX;
        const dy = anchorY - tipY;
        const len = Math.hypot(dx, dy) || 1;
        const startX = tipX - (dx / len) * 5;
        const startY = tipY - (dy / len) * 5;

        ctx.save();
        ctx.imageSmoothingEnabled = false;
        ctx.translate(pivotX, pivotY);
        ctx.rotate(rot);
        ctx.drawImage(spr, -dw / 2, -dh * 0.45, dw, dh);
        ctx.restore();

        ctx.save();
        ctx.imageSmoothingEnabled = false;
        ctx.strokeStyle = '#8a6a3c';
        ctx.lineWidth = 2;
        ctx.lineCap = 'square';
        ctx.beginPath();
        ctx.moveTo(Math.round(startX), Math.round(startY));
        ctx.lineTo(anchorX, anchorY);
        ctx.stroke();
        ctx.strokeStyle = 'rgba(200, 170, 110, 0.55)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(Math.round(startX) + 1, Math.round(startY));
        ctx.lineTo(anchorX + 1, anchorY);
        ctx.stroke();
        ctx.fillStyle = '#c8c0b0';
        ctx.fillRect(Math.round(tipX) - 1, Math.round(tipY) - 1, 3, 3);
        ctx.fillStyle = '#e8c76a';
        ctx.fillRect(anchorX - 2, anchorY - 2, 5, 5);
        ctx.fillStyle = '#fff4c4';
        ctx.fillRect(anchorX, anchorY, 2, 2);
        ctx.restore();
      } else {
        ctx.save();
        ctx.imageSmoothingEnabled = false;
        ctx.translate(pivotX, pivotY);
        ctx.rotate(rot);
        ctx.drawImage(spr, -dw / 2, -dh * 0.45, dw, dh);
        ctx.restore();
      }

      if (animT >= DURATION) playing = false;
    }

    function loop(ts) {
      const dt = Math.min(40, ts - lastTs);
      lastTs = ts;
      draw(dt);
      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        restart();
      }
    });
    canvas.addEventListener('click', restart);
    document.body.addEventListener('click', restart);

    await preload();
    restart();
    requestAnimationFrame((t) => {
      lastTs = t;
      loop(t);
    });
  </script>
</body>
</html>
