<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" width="320" height="420" role="img" aria-label="Vector Crash">
  <defs>
    <linearGradient id="crBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a0f16"/>
      <stop offset="0.55" stop-color="#160a10"/>
      <stop offset="1" stop-color="#0d0710"/>
    </linearGradient>
    <linearGradient id="crLine" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#f43f5e"/>
    </linearGradient>
    <radialGradient id="crGlow" cx="0.72" cy="0.3" r="0.5">
      <stop offset="0" stop-color="#f43f5e" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
    <filter id="crBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="320" height="420" rx="18" fill="url(#crBg)"/>
  <rect width="320" height="420" rx="18" fill="url(#crGlow)"/>

  <!-- subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <path d="M0 90 H320 M0 160 H320 M0 230 H320 M0 300 H320"/>
    <path d="M70 40 V360 M150 40 V360 M230 40 V360"/>
  </g>

  <!-- crash curve -->
  <path d="M28 330 C 110 322, 170 300, 214 232 S 262 120, 292 74" fill="none" stroke="url(#crLine)" stroke-width="9" stroke-linecap="round" filter="url(#crBlur)" opacity="0.7"/>
  <path d="M28 330 C 110 322, 170 300, 214 232 S 262 120, 292 74" fill="none" stroke="url(#crLine)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="292" cy="74" r="9" fill="#ffd7a1"/>
  <circle cx="292" cy="74" r="16" fill="#f43f5e" fill-opacity="0.35"/>

  <!-- multiplier readout -->
  <text x="150" y="150" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-1">2.48×</text>

  <!-- title -->
  <text x="26" y="374" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#ffffff" letter-spacing="0.5">VECTOR</text>
  <text x="26" y="404" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#f97316" letter-spacing="0.5">CRASH</text>

  <!-- studio name bottom-right -->
  <g transform="translate(294,398)" text-anchor="end">
    <text font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#19C7C5" letter-spacing="3">TRIBET</text>
    <text y="13" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="600" fill="#ffffff" fill-opacity="0.5" letter-spacing="2">STUDIO</text>
  </g>
</svg>
