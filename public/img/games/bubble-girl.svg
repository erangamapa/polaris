<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" width="320" height="420" role="img" aria-label="Bubble Girl">
  <defs>
    <linearGradient id="bgBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2d1522"/>
      <stop offset="0.55" stop-color="#1a0a12"/>
      <stop offset="1" stop-color="#0a0508"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="0.5" cy="0.38" r="0.55">
      <stop offset="0" stop-color="#ff6b9d" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff6b9d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bubbleGrad" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#ffc8e6"/>
      <stop offset="0.45" stop-color="#f27bae"/>
      <stop offset="0.85" stop-color="#dc4e82"/>
      <stop offset="1" stop-color="#a62b5a"/>
    </radialGradient>
    <filter id="bgBlur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <rect width="320" height="420" rx="18" fill="url(#bgBg)"/>
  <rect width="320" height="420" rx="18" fill="url(#bgGlow)"/>

  <!-- sparkles -->
  <g fill="#ffb3d1">
    <circle cx="42" cy="48" r="1.8" opacity="0.7"/>
    <circle cx="278" cy="58" r="1.4" opacity="0.6"/>
    <circle cx="290" cy="140" r="1.6" opacity="0.75"/>
    <circle cx="36" cy="160" r="1.2" opacity="0.5"/>
    <circle cx="60" cy="240" r="1.5" opacity="0.65"/>
    <circle cx="270" cy="230" r="1.3" opacity="0.55"/>
  </g>

  <!-- character + bubble -->
  <g transform="translate(160,168)">
    <!-- shoulders -->
    <ellipse cx="0" cy="88" rx="52" ry="36" fill="#2a1520"/>
    <!-- face -->
    <ellipse cx="0" cy="18" rx="42" ry="48" fill="#f5d0c0"/>
    <!-- hair -->
    <ellipse cx="0" cy="-38" rx="46" ry="38" fill="#3d1a2e"/>
    <ellipse cx="-12" cy="-48" rx="20" ry="16" fill="#5c2a44" transform="rotate(-12)"/>
    <ellipse cx="12" cy="-48" rx="20" ry="16" fill="#5c2a44" transform="rotate(12)"/>
    <!-- eyes -->
    <circle cx="-16" cy="8" r="5.5" fill="#1a0a12"/>
    <circle cx="16" cy="8" r="5.5" fill="#1a0a12"/>
    <circle cx="-18" cy="5" r="2" fill="#ffffff"/>
    <circle cx="14" cy="5" r="2" fill="#ffffff"/>
    <!-- blush -->
    <ellipse cx="-30" cy="22" rx="10" ry="6" fill="#ff5078" fill-opacity="0.28"/>
    <ellipse cx="30" cy="22" rx="10" ry="6" fill="#ff5078" fill-opacity="0.28"/>
    <!-- smile -->
    <path d="M -16 32 Q 0 48 16 32" fill="none" stroke="#a05060" stroke-width="2.5" stroke-linecap="round"/>
    <!-- bubble -->
    <circle cx="0" cy="52" r="58" fill="url(#bubbleGrad)" filter="url(#bgBlur)" opacity="0.35"/>
    <circle cx="0" cy="52" r="52" fill="url(#bubbleGrad)" stroke="#ffb0c8" stroke-width="2"/>
    <ellipse cx="-14" cy="34" rx="14" ry="10" fill="#ffffff" fill-opacity="0.35" transform="rotate(-25)"/>
    <text y="58" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">2.4x</text>
  </g>

  <!-- title -->
  <text x="26" y="374" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="0.5">BUBBLE</text>
  <text x="26" y="404" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" fill="#ff6b9d" letter-spacing="0.5">GIRL</text>

  <!-- studio -->
  <g transform="translate(294,398)" text-anchor="end">
    <text font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#19C7C5" letter-spacing="3">TRIBET</text>
    <text y="13" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="600" fill="#ffffff" fill-opacity="0.5" letter-spacing="2">STUDIO</text>
  </g>
</svg>
