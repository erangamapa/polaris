<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" width="320" height="420" role="img" aria-label="Mage Keno">
  <defs>
    <linearGradient id="mkBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a0a22"/>
      <stop offset="0.55" stop-color="#1a0610"/>
      <stop offset="1" stop-color="#0c0308"/>
    </linearGradient>
    <radialGradient id="mkGlow" cx="0.45" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#e0186a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#e0186a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mkFire" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6c8"/>
      <stop offset="0.4" stop-color="#ff9a1a"/>
      <stop offset="1" stop-color="#ff3d00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="320" height="420" rx="18" fill="url(#mkBg)"/>
  <rect width="320" height="420" rx="18" fill="url(#mkGlow)"/>

  <!-- mage silhouette -->
  <g fill="#6a3ab0" fill-opacity="0.95">
    <path d="M78 210 L62 120 L94 120 Z"/>
    <circle cx="78" cy="132" r="14"/>
    <path d="M58 150 h40 l8 70 h-56 z"/>
    <rect x="52" y="218" width="12" height="36" rx="3"/>
    <rect x="92" y="218" width="12" height="36" rx="3"/>
  </g>
  <rect x="108" y="118" width="6" height="90" rx="2" fill="#8b5a2b"/>
  <circle cx="111" cy="112" r="16" fill="url(#mkFire)"/>

  <!-- keno balls -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="800" text-anchor="middle">
    <circle cx="170" cy="130" r="16" fill="#c48a10" stroke="#ffe566" stroke-width="2"/>
    <text x="170" y="134" fill="#1a1000">7</text>
    <circle cx="210" cy="130" r="16" fill="#1a0810" stroke="#ff9ab8" stroke-width="1.5"/>
    <text x="210" y="134" fill="#fff">12</text>
    <circle cx="250" cy="130" r="16" fill="#ff7a18" stroke="#39ffb0" stroke-width="2"/>
    <text x="250" y="134" fill="#1a0800">23</text>
    <circle cx="170" cy="172" r="16" fill="#1a0810" stroke="#ff9ab8" stroke-width="1.5"/>
    <text x="170" y="176" fill="#fff">31</text>
    <circle cx="210" cy="172" r="16" fill="#c48a10" stroke="#ffe566" stroke-width="2"/>
    <text x="210" y="176" fill="#1a1000">4</text>
    <circle cx="250" cy="172" r="16" fill="#2a2a32" stroke="#3a3a48" stroke-width="1.5"/>
    <text x="250" y="176" fill="#9a9aa8">18</text>
  </g>

  <!-- fire trail -->
  <path d="M120 120 C150 100, 190 140, 250 130" fill="none" stroke="#ff9a1a" stroke-width="3" stroke-opacity="0.7"/>

  <text x="26" y="374" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="0.5">MAGE</text>
  <text x="26" y="404" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" fill="#f0c14b" letter-spacing="0.5">KENO</text>

  <g transform="translate(294,398)" text-anchor="end">
    <text font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#19C7C5" letter-spacing="3">TRIBET</text>
    <text y="13" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="600" fill="#ffffff" fill-opacity="0.5" letter-spacing="2">STUDIO</text>
  </g>
</svg>
