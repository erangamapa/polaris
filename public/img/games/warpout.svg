<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" width="320" height="420" role="img" aria-label="Warpout">
  <defs>
    <linearGradient id="woBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1626"/>
      <stop offset="0.55" stop-color="#090c14"/>
      <stop offset="1" stop-color="#05070a"/>
    </linearGradient>
    <radialGradient id="woGlow" cx="0.74" cy="0.24" r="0.55">
      <stop offset="0" stop-color="#4fd8ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#4fd8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="woCurve" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#b46bff"/>
      <stop offset="1" stop-color="#4fd8ff"/>
    </linearGradient>
    <linearGradient id="woHull" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#7fe9ff"/>
    </linearGradient>
    <filter id="woBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="320" height="420" rx="18" fill="url(#woBg)"/>
  <rect width="320" height="420" rx="18" fill="url(#woGlow)"/>

  <!-- warp streaks: starlines rushing toward the ship -->
  <g stroke="#4fd8ff" stroke-linecap="round">
    <path d="M14 356 L96 300" stroke-width="1.4" stroke-opacity="0.35"/>
    <path d="M2 300 L110 254" stroke-width="1.6" stroke-opacity="0.3"/>
    <path d="M30 250 L128 214" stroke-width="1.2" stroke-opacity="0.25"/>
    <path d="M-6 210 L118 176" stroke-width="1.4" stroke-opacity="0.22"/>
    <path d="M40 140 L142 152" stroke-width="1.2" stroke-opacity="0.2"/>
    <path d="M64 90 L156 128" stroke-width="1.4" stroke-opacity="0.25"/>
    <path d="M110 50 L176 108" stroke-width="1.2" stroke-opacity="0.2"/>
  </g>

  <!-- distant stars -->
  <g fill="#ffffff">
    <circle cx="252" cy="46" r="1.6"/><circle cx="284" cy="86" r="1.2"/><circle cx="222" cy="130" r="1.3"/>
    <circle cx="298" cy="150" r="1.5" fill="#a9e8ff"/><circle cx="60" cy="60" r="1.2"/><circle cx="120" cy="40" r="1.4" fill="#d9c2ff"/>
    <circle cx="270" cy="200" r="1.2"/>
  </g>

  <!-- subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.045" stroke-width="1">
    <path d="M0 90 H320 M0 160 H320 M0 230 H320 M0 300 H320"/>
    <path d="M70 40 V360 M150 40 V360 M230 40 V360"/>
  </g>

  <!-- ascending flight path -->
  <path d="M26 332 C 104 324, 166 300, 208 236 S 250 118, 276 78" fill="none" stroke="url(#woCurve)" stroke-width="9" stroke-linecap="round" filter="url(#woBlur)" opacity="0.6"/>
  <path d="M26 332 C 104 324, 166 300, 208 236 S 250 118, 276 78" fill="none" stroke="url(#woCurve)" stroke-width="4" stroke-linecap="round"/>

  <!-- ship: chevron hull (matches in-game brand mark), banking up the flight path -->
  <g transform="translate(276,78) rotate(56)">
    <path d="M0 -20 L15 22 L0 12 L-15 22 Z" fill="url(#woHull)"/>
    <path d="M0 -20 L6 8 L0 12 L-6 8 Z" fill="#0d2430" opacity="0.35"/>
    <path d="M-4 20 L-9 34 L-2 26 Z" fill="#b46bff"/>
    <path d="M4 20 L9 34 L2 26 Z" fill="#ff4fd8"/>
  </g>
  <circle cx="276" cy="78" r="18" fill="#4fd8ff" fill-opacity="0.3" filter="url(#woBlur)"/>

  <!-- multiplier readout -->
  <text x="150" y="150" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-1">2.48×</text>

  <!-- title -->
  <text x="26" y="374" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#ffffff" letter-spacing="0.5">WARP</text>
  <text x="26" y="404" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#4fd8ff" letter-spacing="0.5">OUT</text>

  <!-- studio name bottom-right -->
  <g transform="translate(294,398)" text-anchor="end">
    <text font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#4fd8ff" letter-spacing="3">TRIBET</text>
    <text y="13" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="600" fill="#ffffff" fill-opacity="0.5" letter-spacing="2">STUDIO</text>
  </g>
</svg>
