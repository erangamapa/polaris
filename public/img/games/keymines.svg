<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" width="320" height="420" role="img" aria-label="KeyMines">
  <defs>
    <linearGradient id="kmBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1a1a"/>
      <stop offset="0.55" stop-color="#0f0f0f"/>
      <stop offset="1" stop-color="#080808"/>
    </linearGradient>
    <radialGradient id="kmGlow" cx="0.5" cy="0.28" r="0.5">
      <stop offset="0" stop-color="#00e676" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00e676" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="320" height="420" rx="18" fill="url(#kmBg)"/>
  <rect width="320" height="420" rx="18" fill="url(#kmGlow)"/>

  <!-- keyboard case -->
  <rect x="36" y="88" width="248" height="160" rx="14" fill="#2a2a2a" stroke="#b8860b" stroke-width="2"/>
  <rect x="48" y="100" width="224" height="136" rx="8" fill="#1a1a1a"/>

  <!-- key rows -->
  <g>
    <!-- row 1 -->
    <rect x="58" y="112" width="28" height="28" rx="4" fill="#d8d2c4"/>
    <rect x="92" y="112" width="28" height="28" rx="4" fill="#d8d2c4"/>
    <rect x="126" y="112" width="28" height="28" rx="4" fill="#d32f2f"/>
    <rect x="160" y="112" width="28" height="28" rx="4" fill="#d8d2c4"/>
    <rect x="194" y="112" width="28" height="28" rx="4" fill="#00e676" fill-opacity="0.85"/>
    <rect x="228" y="112" width="28" height="28" rx="4" fill="#d8d2c4"/>
    <!-- row 2 -->
    <rect x="74" y="148" width="28" height="28" rx="4" fill="#d8d2c4"/>
    <rect x="108" y="148" width="28" height="28" rx="4" fill="#00e676" fill-opacity="0.85"/>
    <rect x="142" y="148" width="28" height="28" rx="4" fill="#d8d2c4"/>
    <rect x="176" y="148" width="28" height="28" rx="4" fill="#d32f2f"/>
    <rect x="210" y="148" width="28" height="28" rx="4" fill="#d8d2c4"/>
    <!-- row 3 -->
    <rect x="90" y="184" width="28" height="28" rx="4" fill="#d8d2c4"/>
    <rect x="124" y="184" width="28" height="28" rx="4" fill="#d8d2c4"/>
    <rect x="158" y="184" width="28" height="28" rx="4" fill="#00e676" fill-opacity="0.85"/>
    <rect x="192" y="184" width="28" height="28" rx="4" fill="#d8d2c4"/>
  </g>

  <!-- OLED readout -->
  <rect x="100" y="268" width="120" height="36" rx="6" fill="#050505" stroke="#b8860b" stroke-width="1.5"/>
  <text x="160" y="292" font-family="Courier New, monospace" font-size="14" font-weight="700" fill="#00e676" text-anchor="middle">2.45× SAFE</text>

  <text x="26" y="374" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#ffffff" letter-spacing="0.5">KEY</text>
  <text x="26" y="404" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#00e676" letter-spacing="0.5">MINES</text>

  <g transform="translate(294,398)" text-anchor="end">
    <text font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#19C7C5" letter-spacing="3">TRIBET</text>
    <text y="13" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="600" fill="#ffffff" fill-opacity="0.5" letter-spacing="2">STUDIO</text>
  </g>
</svg>
