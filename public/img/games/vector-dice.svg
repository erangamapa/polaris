<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" width="320" height="420" role="img" aria-label="Vector Dice">
  <defs>
    <linearGradient id="dcBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171633"/>
      <stop offset="0.55" stop-color="#0f0d22"/>
      <stop offset="1" stop-color="#0b0a18"/>
    </linearGradient>
    <linearGradient id="dcDie" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b7bff"/>
      <stop offset="1" stop-color="#6d3bf4"/>
    </linearGradient>
    <linearGradient id="dcDie2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c7bcff"/>
      <stop offset="1" stop-color="#8f6bff"/>
    </linearGradient>
    <radialGradient id="dcGlow" cx="0.5" cy="0.32" r="0.5">
      <stop offset="0" stop-color="#7c4dff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7c4dff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="320" height="420" rx="18" fill="url(#dcBg)"/>
  <rect width="320" height="420" rx="18" fill="url(#dcGlow)"/>

  <!-- back die (5) -->
  <g transform="translate(56,70) rotate(-12)">
    <rect width="118" height="118" rx="26" fill="url(#dcDie2)" opacity="0.55"/>
    <g fill="#2a1a5e">
      <circle cx="30" cy="30" r="10"/><circle cx="88" cy="30" r="10"/>
      <circle cx="59" cy="59" r="10"/>
      <circle cx="30" cy="88" r="10"/><circle cx="88" cy="88" r="10"/>
    </g>
  </g>

  <!-- front die (4) -->
  <g transform="translate(132,118) rotate(9)">
    <rect width="132" height="132" rx="28" fill="url(#dcDie)"/>
    <rect width="132" height="132" rx="28" fill="#ffffff" fill-opacity="0.06"/>
    <g fill="#ffffff">
      <circle cx="36" cy="36" r="12"/><circle cx="96" cy="36" r="12"/>
      <circle cx="36" cy="96" r="12"/><circle cx="96" cy="96" r="12"/>
    </g>
  </g>

  <!-- title -->
  <text x="26" y="374" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#ffffff" letter-spacing="0.5">VECTOR</text>
  <text x="26" y="404" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#8f6bff" letter-spacing="0.5">DICE</text>

  <!-- studio name bottom-right -->
  <g transform="translate(294,398)" text-anchor="end">
    <text font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#19C7C5" letter-spacing="3">TRIBET</text>
    <text y="13" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="600" fill="#ffffff" fill-opacity="0.5" letter-spacing="2">STUDIO</text>
  </g>
</svg>
