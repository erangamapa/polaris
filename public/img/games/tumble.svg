<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" width="320" height="420" role="img" aria-label="Tumble">
  <defs>
    <linearGradient id="tbSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd4ff"/>
      <stop offset="0.55" stop-color="#bfeaff"/>
      <stop offset="1" stop-color="#eaf7ff"/>
    </linearGradient>
    <radialGradient id="tbSun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6cf"/>
      <stop offset="0.5" stop-color="#ffe488" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffe488" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tbSlope" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbeeff"/>
    </linearGradient>
    <radialGradient id="tbBall" cx="0.38" cy="0.34" r="0.72">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#eef6ff"/>
      <stop offset="1" stop-color="#c9def0"/>
    </radialGradient>
  </defs>

  <rect width="320" height="420" rx="18" fill="url(#tbSky)"/>

  <!-- sun -->
  <circle cx="242" cy="82" r="78" fill="url(#tbSun)"/>
  <circle cx="242" cy="82" r="30" fill="#fff2b0"/>

  <!-- distant parallax mountains -->
  <path d="M0 176 L74 120 L128 168 L196 108 L266 170 L320 132 L320 220 L0 220 Z" fill="#bcdcf2" opacity="0.7"/>
  <path d="M0 200 L60 150 L150 205 L230 145 L320 200 L320 260 L0 260 Z" fill="#a6cfea" opacity="0.6"/>

  <!-- clouds -->
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="70" cy="70" rx="30" ry="12"/>
    <ellipse cx="92" cy="62" rx="18" ry="11"/>
    <ellipse cx="150" cy="104" rx="22" ry="9"/>
  </g>

  <!-- snow slope sweeping down-right -->
  <path d="M0 250 C120 226 210 300 320 250 L320 420 L0 420 Z" fill="url(#tbSlope)"/>
  <path d="M0 250 C120 226 210 300 320 250" fill="none" stroke="#cfe6fa" stroke-width="3" opacity="0.7"/>

  <!-- pines (obstacles) -->
  <g>
    <g transform="translate(58,300)">
      <path d="M0 0 L-13 22 L13 22 Z" fill="#2f7d4f"/>
      <path d="M0 -12 L-11 14 L11 14 Z" fill="#3a9160"/>
      <rect x="-3" y="22" width="6" height="9" fill="#7a4a22"/>
    </g>
    <g transform="translate(268,296)">
      <path d="M0 0 L-11 19 L11 19 Z" fill="#2f7d4f"/>
      <path d="M0 -10 L-9 12 L9 12 Z" fill="#3a9160"/>
      <rect x="-3" y="19" width="6" height="8" fill="#7a4a22"/>
    </g>
  </g>

  <!-- dashed tumble trail -->
  <path d="M96 232 C132 250 150 226 190 258" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 9" opacity="0.85"/>

  <!-- snowball critter -->
  <g transform="translate(196,252)">
    <ellipse cx="2" cy="30" rx="26" ry="7" fill="#9fc2de" opacity="0.35"/>
    <circle r="30" fill="url(#tbBall)"/>
    <!-- snow spray -->
    <g fill="#ffffff">
      <circle cx="-30" cy="10" r="3.5"/><circle cx="-38" cy="-2" r="2.5"/>
      <circle cx="-24" cy="24" r="2.5"/><circle cx="-42" cy="16" r="2"/>
    </g>
    <!-- face -->
    <circle cx="-8" cy="-5" r="3.6" fill="#22303a"/>
    <circle cx="9" cy="-5" r="3.6" fill="#22303a"/>
    <circle cx="-6.6" cy="-6.2" r="1.1" fill="#fff"/>
    <circle cx="10.4" cy="-6.2" r="1.1" fill="#fff"/>
    <path d="M-7 8 Q1 15 10 7" fill="none" stroke="#22303a" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="-14" cy="4" r="4" fill="#ffb3b3" opacity="0.55"/>
    <circle cx="16" cy="4" r="4" fill="#ffb3b3" opacity="0.55"/>
  </g>

  <!-- multiplier chip -->
  <g transform="translate(28,196)">
    <rect x="0" y="0" width="92" height="34" rx="17" fill="#0f2233" opacity="0.82"/>
    <text x="46" y="23" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800" fill="#7ff0c0" text-anchor="middle">4.20×</text>
  </g>

  <!-- title -->
  <text x="24" y="372" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="800" fill="#0f3a57" letter-spacing="1">TUMBLE</text>

  <!-- studio -->
  <g transform="translate(294,398)" text-anchor="end">
    <text font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#19C7C5" letter-spacing="3">TRIBET</text>
    <text y="13" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="600" fill="#0f3a57" fill-opacity="0.6" letter-spacing="2">STUDIO</text>
  </g>
</svg>
