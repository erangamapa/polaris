<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" width="320" height="420" role="img" aria-label="Drunken Pirate">
  <defs>
    <linearGradient id="dpBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1208"/>
      <stop offset="0.55" stop-color="#0e0a06"/>
      <stop offset="1" stop-color="#080604"/>
    </linearGradient>
    <radialGradient id="dpGlow" cx="0.55" cy="0.28" r="0.55">
      <stop offset="0" stop-color="#e8a317" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#e8a317" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dpWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c3a1e"/>
      <stop offset="1" stop-color="#3a2412"/>
    </linearGradient>
  </defs>

  <rect width="320" height="420" rx="18" fill="url(#dpBg)"/>
  <rect width="320" height="420" rx="18" fill="url(#dpGlow)"/>

  <!-- ship's wheel -->
  <g transform="translate(160,165)">
    <circle r="78" fill="none" stroke="#c9a227" stroke-width="10"/>
    <circle r="18" fill="#c9a227"/>
    <g stroke="#c9a227" stroke-width="8" stroke-linecap="round">
      <line x1="0" y1="-78" x2="0" y2="78"/>
      <line x1="-78" y1="0" x2="78" y2="0"/>
      <line x1="-55" y1="-55" x2="55" y2="55"/>
      <line x1="55" y1="-55" x2="-55" y2="55"/>
    </g>
    <!-- apple accent -->
    <circle cx="42" cy="-42" r="14" fill="#2ecc71"/>
    <rect x="40" y="-56" width="4" height="8" rx="1" fill="#5c3a1e"/>
    <!-- skull accent -->
    <circle cx="-42" cy="42" r="12" fill="#e8e0d5"/>
    <circle cx="-46" cy="40" r="2" fill="#1a1208"/>
    <circle cx="-38" cy="40" r="2" fill="#1a1208"/>
  </g>

  <!-- multiplier -->
  <text x="160" y="290" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="800" fill="#e8a317" text-anchor="middle">4.00×</text>

  <text x="26" y="374" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800" fill="#ffffff" letter-spacing="0.5">DRUNKEN</text>
  <text x="26" y="404" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800" fill="#e8a317" letter-spacing="0.5">PIRATE</text>

  <g transform="translate(294,398)" text-anchor="end">
    <text font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#19C7C5" letter-spacing="3">TRIBET</text>
    <text y="13" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="600" fill="#ffffff" fill-opacity="0.5" letter-spacing="2">STUDIO</text>
  </g>
</svg>
