<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- The app shell keeps its own icon at /app-favicon.svg: the site root now
         serves the static landing page (landing/), whose /favicon.svg is a
         different mark. One origin, two documents, two icons. -->
    <link rel="icon" type="image/svg+xml" href="/app-favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- These are the DEFAULTS a crawler sees before the bundle runs. src/lib/seo.js
         replaces title/description/canonical/og per route on every navigation, so
         what is here is the fallback for the app's most-linked entry point, the
         Casino Lobby. Player-visible copy is "Tribet", never "TriBet" (lib/brand.js). -->
    <title>Casino Lobby | Tribet</title>
    <meta
      name="description"
      content="Explore slots, table games and quick-play favourites on Tribet. Current games use provider credits with no cash winnings."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#0A0B0D" />
    <link rel="canonical" href="https://tribet.gg/casino/lobby" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tribet" />
    <meta property="og:url" content="https://tribet.gg/casino/lobby" />
    <meta property="og:title" content="Casino Lobby | Tribet" />
    <meta
      property="og:description"
      content="Explore slots, table games and quick-play favourites on Tribet. Current games use provider credits with no cash winnings."
    />
    <meta property="og:image" content="https://tribet.gg/lobby-preview.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://tribet.gg/lobby-preview.png" />
    <!-- RESKIN (Ultimate Reskin Specification v1, "Tribet Reskin Guide
         (2).md") — status: Authoritative, overrides all prior visual
         guidance including the previous pass's Barlow/Barlow Condensed/
         Barlow Semi Condensed direction. Per the doc's own §2.1: Söhne is
         the licensed target (unavailable in this environment), Onest is
         its named free stand-in, loaded here + JetBrains Mono for data.
         Never Inter — "Inter is the identity being replaced." Local/
         uncommitted — remove this link to revert. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
